---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-vsp
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-vsp-role
rules:
- apiGroups:
  - config.openshift.io
  resources:
  - dataprocessingunits
  - dpuoperatorconfigs
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - config.openshift.io
  resources:
  - dataprocessingunits/status
  - dpuoperatorconfigs/status
  verbs:
  - get
  - patch
  - update
# Observe the DPF create intent. CreateNetworkFunction must not succeed
# until a DPUService exists; this role is get/list/watch only.
- apiGroups:
  - svc.dpu.nvidia.com
  resources:
  - dpuservices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-vsp-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-vsp-role
subjects:
- kind: ServiceAccount
  name: nvidia-vsp
  namespace: system
