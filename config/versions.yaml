# Pinned APIs this adapter is tested against.
#
# Update this file, pkg/lifecycle/version.go, and the vendored CRDs under
# test/e2e/crds/ in the same change. The window is a claim about the fixtures
# the mapping fields were compared to, not an aspiration.
#
# Compared on 2026-10-22 against the live cluster on lab host dh2 before
# this pin was written. See docs/api-versions.md.

kubernetes:
  # k3s on dh2. Go modules track the same minor.
  version: v1.36.4
  distribution: k3s
  goModule: v0.36.5

opi:
  group: config.openshift.io
  version: v1
  # Chart fields are not on opiproject/dpu-operator main. They live on
  # unmerged PR #6. Do not silently treat them as upstream-stable.
  repository: github.com/kartikeyg0104/dpu-operator
  upstream: github.com/opiproject/dpu-operator
  pullRequest: https://github.com/opiproject/dpu-operator/pull/6
  patchState: unmerged
  ref: feat/sfc-helm-chart
  commit: c107ef719f74d4f841ceb1ed45bbd293b3739a3c
  fixtures: test/e2e/crds/opi
  kinds:
    - DataProcessingUnit
    - ServiceFunctionChain
    - DpuOperatorConfig

dpf:
  release: v26.4.0
  repository: github.com/NVIDIA/doca-platform
  # Local checkout whose provisioning CRDs contain astraEnabled (v26.4 line).
  commit: 6160eaba2dadaf3a91bd35ad649935985b69a9c5
  fixtures: test/e2e/crds/dpf
  supportWindow:
    minInclusive: v26.4.0
    maxExclusive: v27.0.0
  mappedKinds:
    - DPUDevice
    - DPUFlavor
    - BFB
    - DPU
    - DPUService
    - DPUServiceInterface
    - DPUServiceChain
  # The only Helm settings the LCM will ever use. Chart URLs and extra
  # helm args on DpuOperatorConfig are rejected.
  helm:
    chart: dpf-operator
    repo: https://helm.ngc.nvidia.com/nvidia/doca
    version: v26.4.0
    release: dpf-operator
    namespace: dpf-operator-system
    owner: opi-nvidia-dpf-adapter
  # Latest DPF docs (v26.4.0 / v26.4.1) install through Helm only.
  # Empty fields mean observe-only: if operators.coreos.com exists,
  # read Subscription/CSV at dpf-operator-system/dpf-operator; never
  # create a catalog, operator group, or Subscription.
  olm:
    published: false
    package: ""
    channel: ""
    catalog: ""
  # DPF v26.4 Helm prerequisites (docs/public/getting-started/helm-prerequisites.md).
  # Kamaji is required only when a DPUCluster uses type=kamaji.
  dependencies:
    required:
      - cert-manager
      - argo-cd
    conditional:
      - kamaji

# AMD Pensando DSC. Known vendor, no published operator chart.
# Latest public AMD Helm is the Network Operator (Pollara AI NIC) and
# Lago telemetry — neither is a DSC DPU operator. CRDs under
# test/conformance/crds/amd are stubs. Do not apply them on BlueField.
amd:
  supportWindow: unpinned
  helm:
    published: false
    chart: ""
    repo: ""
    version: ""
    release: ""
  olm:
    published: false
    package: ""
    channel: ""
    catalog: ""
